<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | SIF Safety</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f4faf7;
            color: #10231c;
        }

        /* ================= HEADER ================= */

        header {
            height: 76px;
            background: white;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 6%;

            border-bottom: 1px solid #dce9e4;

            position: sticky;
            top: 0;
            z-index: 1000;
        }

        /* ================= LOGO ================= */

        .logo {
            display: flex;
            align-items: center;
            gap: 11px;

            text-decoration: none;
        }

        .logo-icon {
            width: 43px;
            height: 43px;

            background: #087d4d;
            color: white;

            border-radius: 10px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 22px;

            transition: all 0.3s ease;
        }

        .logo:hover .logo-icon {
            box-shadow:
                0 0 8px rgba(8, 125, 77, 0.5),
                0 0 18px rgba(8, 125, 77, 0.35),
                0 0 30px rgba(8, 125, 77, 0.2);

            transform: scale(1.05);
        }

        .logo h2 {
            color: #087d4d;
            font-size: 21px;
        }

        .logo p {
            color: #777;
            font-size: 10px;
            margin-top: 3px;
        }

        /* ================= NAVIGATION ================= */

        nav {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        nav a {
            text-decoration: none;

            color: #27332e;

            font-size: 13px;
            font-weight: 500;

            padding: 10px 14px;

            border-radius: 7px;

            position: relative;

            transition: all 0.3s ease;
        }

        /* GLOW ON HOVER */

        nav a:hover {
            color: #087d4d;

            background: #e8f7f0;

            box-shadow:
                0 0 5px rgba(8, 125, 77, 0.35),
                0 0 12px rgba(8, 125, 77, 0.25),
                0 0 22px rgba(8, 125, 77, 0.15);

            transform: translateY(-2px);
        }

        /* UNDERLINE GLOW */

        nav a::after {
            content: "";

            position: absolute;

            left: 50%;
            bottom: 3px;

            width: 0;
            height: 2px;

            background: #087d4d;

            border-radius: 10px;

            transform: translateX(-50%);

            transition: width 0.3s ease;

            box-shadow:
                0 0 5px rgba(8, 125, 77, 0.7);
        }

        nav a:hover::after {
            width: 60%;
        }

        /* ACTIVE PAGE */

        nav a.active {
            color: #087d4d;

            background: #e8f7f0;

            font-weight: 700;

            box-shadow:
                0 0 6px rgba(8, 125, 77, 0.3),
                0 0 15px rgba(8, 125, 77, 0.18);
        }

        nav a.active::after {
            width: 60%;
        }

        /* ================= LOGIN BUTTON ================= */

        .login-btn {
            text-decoration: none;

            background: #087d4d;

            color: white;

            padding: 11px 18px;

            border-radius: 7px;

            font-size: 13px;

            font-weight: bold;

            margin-left: 10px;

            transition: all 0.3s ease;
        }

        .login-btn:hover {
            background: #066b40;

            box-shadow:
                0 0 7px rgba(8, 125, 77, 0.55),
                0 0 16px rgba(8, 125, 77, 0.4),
                0 0 30px rgba(8, 125, 77, 0.22);

            transform: translateY(-2px);
        }

        /* ================= REGISTER AREA ================= */

        .register-container {
            min-height: calc(100vh - 76px);

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 45px 20px;
        }

        .register-box {
            width: 480px;

            background: white;

            border: 1px solid #dce9e4;

            border-radius: 16px;

            padding: 34px;

            box-shadow:
                0 15px 40px rgba(8, 125, 77, 0.08);

            transition: all 0.3s ease;
        }

        .register-box:hover {
            box-shadow:
                0 15px 40px rgba(8, 125, 77, 0.10),
                0 0 25px rgba(8, 125, 77, 0.05);
        }

        /* ================= REGISTER ICON ================= */

        .register-icon {
            width: 65px;
            height: 65px;

            background: #e7f8ef;

            border-radius: 50%;

            margin: auto;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 28px;

            transition: all 0.3s ease;
        }

        .register-icon:hover {
            box-shadow:
                0 0 8px rgba(8, 125, 77, 0.4),
                0 0 20px rgba(8, 125, 77, 0.25),
                0 0 35px rgba(8, 125, 77, 0.12);

            transform: scale(1.05);
        }

        .register-box h1 {
            text-align: center;

            font-size: 27px;

            margin-top: 17px;
        }

        .subtitle {
            text-align: center;

            color: #718079;

            font-size: 12px;

            margin-top: 7px;

            margin-bottom: 27px;
        }

        /* ================= FORM ================= */

        .row {
            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 14px;
        }

        .form-group {
            margin-bottom: 17px;
        }

        label {
            display: block;

            font-size: 11px;

            font-weight: bold;

            margin-bottom: 7px;

            color: #27332e;
        }

        input,
        select {
            width: 100%;

            padding: 12px;

            border: 1px solid #ccdcd5;

            border-radius: 7px;

            outline: none;

            font-size: 12px;

            background: white;

            transition: all 0.3s ease;
        }

        /* INPUT GLOW */

        input:hover,
        select:hover {
            border-color: #8bc7ac;

            box-shadow:
                0 0 6px rgba(8, 125, 77, 0.12);
        }

        input:focus,
        select:focus {
            border-color: #087d4d;

            box-shadow:
                0 0 0 3px rgba(8, 125, 77, 0.08),
                0 0 12px rgba(8, 125, 77, 0.15);
        }

        /* ================= TERMS ================= */

        .terms {
            display: flex;

            align-items: flex-start;

            gap: 8px;

            margin: 4px 0 20px;
        }

        .terms input {
            width: auto;

            margin-top: 2px;
        }

        .terms input:focus {
            box-shadow: none;
        }

        .terms label {
            font-size: 10px;

            font-weight: normal;

            line-height: 1.5;

            margin: 0;
        }

        .terms a {
            color: #087d4d;

            text-decoration: none;

            transition: 0.2s;
        }

        .terms a:hover {
            text-shadow:
                0 0 7px rgba(8, 125, 77, 0.4);
        }

        /* ================= CREATE BUTTON ================= */

        .create-btn {
            width: 100%;

            border: none;

            background: #087d4d;

            color: white;

            padding: 14px;

            border-radius: 7px;

            font-size: 13px;

            font-weight: bold;

            cursor: pointer;

            transition: all 0.3s ease;
        }

        .create-btn:hover {
            background: #066b40;

            box-shadow:
                0 0 8px rgba(8, 125, 77, 0.55),
                0 0 18px rgba(8, 125, 77, 0.4),
                0 0 32px rgba(8, 125, 77, 0.2);

            transform: translateY(-2px);
        }

        .create-btn:active {
            transform: translateY(0);

            box-shadow:
                0 0 5px rgba(8, 125, 77, 0.4);
        }

        /* ================= LOGIN LINK ================= */

        .already {
            text-align: center;

            color: #718079;

            font-size: 11px;

            margin-top: 20px;
        }

        .already a {
            color: #087d4d;

            text-decoration: none;

            font-weight: bold;

            transition: all 0.3s ease;
        }

        .already a:hover {
            text-shadow:
                0 0 6px rgba(8, 125, 77, 0.5),
                0 0 12px rgba(8, 125, 77, 0.25);
        }

        /* ================= RESPONSIVE ================= */

        @media (max-width: 850px) {

            header {
                height: auto;

                padding: 15px;

                flex-wrap: wrap;
            }

            nav {
                width: 100%;

                order: 3;

                justify-content: center;

                flex-wrap: wrap;

                margin-top: 12px;
            }

        }

        @media (max-width: 550px) {

            .row {
                grid-template-columns: 1fr;
            }

            .register-box {
                padding: 25px 20px;
            }

            .logo p {
                display: none;
            }

            .logo h2 {
                font-size: 18px;
            }

            nav a {
                font-size: 11px;

                padding: 8px 9px;
            }

        }

    </style>

</head>


<body>


<!-- ================= HEADER ================= -->

<header>


    <a href="index.html" class="logo">

        <div class="logo-icon">
            🛡
        </div>

        <div>

            <h2>SIF Safety</h2>

            <p>
                Safe Today, Secure Tomorrow
            </p>

        </div>

    </a>


    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="report.html">
            Report Near-Miss
        </a>

        <a href="dashboard.html">
            Dashboard
        </a>

        <a href="about.html">
            About Us
        </a>

        <a href="contact.html">
            Contact
        </a>

    </nav>


    <a href="login.html" class="login-btn">
        Login
    </a>


</header>


<!-- ================= REGISTER ================= -->

<div class="register-container">


    <div class="register-box">


        <div class="register-icon">
            👤
        </div>


        <h1>
            Create Account
        </h1>


        <p class="subtitle">
            Join SIF Safety and help create a safer workplace
        </p>


        <form action="register.php" method="POST">


            <!-- NAME -->

            <div class="row">


                <div class="form-group">

                    <label>
                        First Name
                    </label>

                    <input
                        type="text"
                        name="first_name"
                        placeholder="Enter first name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Last Name
                    </label>

                    <input
                        type="text"
                        name="last_name"
                        placeholder="Enter last name"
                        required
                    >

                </div>


            </div>


            <!-- EMAIL -->

            <div class="form-group">

                <label>
                    Email Address
                </label>

                <input
                    type="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <!-- PHONE -->

            <div class="form-group">

                <label>
                    Phone Number
                </label>

                <input
                    type="tel"
                    name="phone"
                    placeholder="Enter phone number"
                    pattern="[0-9]{10}"
                    title="Enter a valid 10 digit phone number"
                >

            </div>


            <!-- DEPARTMENT -->

            <div class="form-group">

                <label>
                    Department
                </label>

                <select
                    name="department"
                    required
                >

                    <option value="">
                        Select Department
                    </option>

                    <option value="Production">
                        Production
                    </option>

                    <option value="Safety">
                        Safety
                    </option>

                    <option value="Human Resources">
                        Human Resources
                    </option>

                    <option value="Maintenance">
                        Maintenance
                    </option>

                    <option value="Management">
                        Management
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>

            </div>


            <!-- PASSWORD -->

            <div class="row">


                <div class="form-group">

                    <label>
                        Password
                    </label>

                    <input
                        type="password"
                        name="password"
                        id="password"
                        placeholder="Create password"
                        minlength="6"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        name="confirm_password"
                        id="confirm_password"
                        placeholder="Confirm password"
                        minlength="6"
                        required
                    >

                </div>


            </div>


            <!-- TERMS -->

            <div class="terms">

                <input
                    type="checkbox"
                    id="terms"
                    required
                >

                <label for="terms">

                    I agree to the

                    <a href="#">
                        Terms & Conditions
                    </a>

                    and

                    <a href="#">
                        Privacy Policy
                    </a>.

                </label>

            </div>


            <!-- CREATE ACCOUNT -->

            <button
                type="submit"
                class="create-btn"
            >
                Create Account
            </button>


        </form>


        <!-- LOGIN -->

        <div class="already">

            Already have an account?

            <a href="login.html">
                Login Here
            </a>

        </div>


    </div>


</div>


<!-- ================= PASSWORD CHECK ================= -->

<script>

    const form = document.querySelector("form");

    form.addEventListener("submit", function(event) {

        const password =
            document.getElementById("password").value;

        const confirmPassword =
            document.getElementById("confirm_password").value;

        if (password !== confirmPassword) {

            event.preventDefault();

            alert("Passwords do not match!");

        }

    });

</script>


</body>

</html>
